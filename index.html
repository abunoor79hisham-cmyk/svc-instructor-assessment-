function bindLoginEvents() {
  var form = document.getElementById('loginForm');
  if (form) {
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var hid = document.getElementById('headSelect').value, pw = document.getElementById('passwordInput').value, ed = document.getElementById('loginError');
      if (!hid) { ed.innerHTML = '<div class="flex items-start gap-2 p-3 bg-rose-50 border border-rose-200 text-rose-700 dark:bg-rose-950/20 rounded-xl text-xs font-semibold flex-row-reverse"><i data-lucide="AlertCircle" class="w-4 h-4 shrink-0 mt-0.5"></i><span>اختر رئيس القسم</span></div>'; try{lucide.createIcons();}catch(e){} return; }
      var h = state.departmentHeads.find(function(x){ return x.id === hid; });
      if (!h) { ed.innerHTML = '<div class="flex items-start gap-2 p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-xs font-semibold flex-row-reverse"><i data-lucide="AlertCircle" class="w-4 h-4"></i><span>المسؤول غير موجود</span></div>'; try{lucide.createIcons();}catch(e){} return; }
      if (pw !== h.passwordHash) { ed.innerHTML = '<div class="flex items-start gap-2 p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-xs font-semibold flex-row-reverse"><i data-lucide="AlertCircle" class="w-4 h-4"></i><span>الرقم السري غير صحيح</span></div>'; try{lucide.createIcons();}catch(e){} return; }
      if (h.isFirstLogin || h.passwordHash === 'seebvc@123') {
        sessionStorage.setItem('tempHeadId', hid);
        sessionStorage.setItem('loginStep', 'change_password');
        render(); return;
      }
      state.currentUser = h; state.currentRole = 'head'; saveState();
      sessionStorage.removeItem('tempHeadId'); sessionStorage.removeItem('loginStep');
      render();
    });
  }
  var tp = document.getElementById('togglePassword');
  if (tp) { tp.addEventListener('click', function(){ var i=document.getElementById('passwordInput'); i.type=i.type==='password'?'text':'password'; tp.innerHTML='<i data-lucide="'+(i.type==='password'?'Eye':'EyeOff')+'" class="w-4 h-4"></i>'; try{lucide.createIcons();}catch(e){} }); }
  var pf = document.getElementById('pwChangeForm');
  if (pf) {
    pf.addEventListener('submit', function(e) {
      e.preventDefault();
      var np = document.getElementById('newPw').value, cp = document.getElementById('confirmPw').value, ed = document.getElementById('pwChangeError');
      var hid = sessionStorage.getItem('tempHeadId'), h = state.departmentHeads.find(function(x){ return x.id === hid; });
      if (!np || np.length < 6) { ed.innerHTML = '<div class="flex items-start gap-2 p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-xs font-semibold flex-row-reverse"><i data-lucide="AlertCircle" class="w-4 h-4"></i><span>6 خانات كحد أدنى</span></div>'; try{lucide.createIcons();}catch(e){} return; }
      if (np === 'seebvc@123') { ed.innerHTML = '<div class="flex items-start gap-2 p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-xs font-semibold flex-row-reverse"><i data-lucide="AlertCircle" class="w-4 h-4"></i><span>استخدم رقماً سرياً جديداً</span></div>'; try{lucide.createIcons();}catch(e){} return; }
      if (np !== cp) { ed.innerHTML = '<div class="flex items-start gap-2 p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-xs font-semibold flex-row-reverse"><i data-lucide="AlertCircle" class="w-4 h-4"></i><span>غير متطابقين</span></div>'; try{lucide.createIcons();}catch(e){} return; }
      if (h) {
        state.departmentHeads = state.departmentHeads.map(function(x){ return x.id === hid ? { id:x.id, username:x.username, name:x.name, departmentId:x.departmentId, passwordHash:np, isFirstLogin:false } : x; });
        state.currentUser = { id:h.id, username:h.username, name:h.name, departmentId:h.departmentId, passwordHash:np, isFirstLogin:false };
        state.currentRole = 'head'; saveState();
        sessionStorage.removeItem('tempHeadId'); sessionStorage.removeItem('loginStep');
        render();
      }
    });
  }
  var cp = document.getElementById('cancelPwChange');

var signCtx = {}, signDrawing = {}, signEmpty = {};
function initSignCanvases() {
  ['ass','tr'].forEach(function(id) {
    var c = document.getElementById(id+'Sign');
    if (!c) return;
    signCtx[id] = c.getContext('2d');
    signDrawing[id] = false;
    signEmpty[id] = true;
    var drawStart = function(e) { e.preventDefault(); var ctx = signCtx[id]; if (!ctx) return; ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=id==='ass'?'#0284c7':'#2563eb'; var r=c.getBoundingClientRect(); var x,y; if (e.touches) { x=(e.touches[0].clientX-r.left)/r.width*c.width; y=(e.touches[0].clientY-r.top)/r.height*c.height; } else { x=(e.clientX-r.left)/r.width*c.width; y=(e.clientY-r.top)/r.height*c.height; } ctx.beginPath(); ctx.moveTo(x,y); signDrawing[id]=true; signEmpty[id]=false; };
    var drawMove = function(e) { if (!signDrawing[id]) return; e.preventDefault(); var ctx=signCtx[id]; if(!ctx)return; var r=c.getBoundingClientRect(); var x,y; if(e.touches){x=(e.touches[0].clientX-r.left)/r.width*c.width; y=(e.touches[0].clientY-r.top)/r.height*c.height;}else{x=(e.clientX-r.left)/r.width*c.width; y=(e.clientY-r.top)/r.height*c.height;} ctx.lineTo(x,y); ctx.stroke(); };
    var drawEnd = function() { signDrawing[id]=false; };
    c.addEventListener('mousedown', drawStart);
    c.addEventListener('mousemove', drawMove);
    c.addEventListener('mouseup', drawEnd);
    c.addEventListener('mouseleave', drawEnd);
    c.addEventListener('touchstart', drawStart, {passive:false});
    c.addEventListener('touchmove', drawMove, {passive:false});
    c.addEventListener('touchend', drawEnd);
  });
}
function uploadSign(id, input) {
  var file = input.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var c = document.getElementById(id+'Sign'); if (!c) return;
      var ctx = c.getContext('2d'); if (!ctx) return;
      ctx.clearRect(0, 0, c.width, c.height);
      var scale = Math.min(c.width/img.width, c.height/img.height) * 0.85;
      var x = (c.width - img.width*scale)/2, y = (c.height - img.height*scale)/2;
      ctx.drawImage(img, x, y, img.width*scale, img.height*scale);
      signEmpty[id] = false;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}
function clearSign(id) {
  var c = document.getElementById(id+'Sign'); if (!c) return;
  var ctx = c.getContext('2d'); if (!ctx) return;
  ctx.clearRect(0, 0, c.width, c.height); signEmpty[id] = true;
}
function getSignData(id) {
  if (signEmpty[id]) return '';
  var c = document.getElementById(id+'Sign'); if (!c) return '';
  return c.toDataURL('image/png');
}

function importTrainersFile(input) {
  var file = input.files[0];
  if (!file) return;
  var ext = file.name.split('.').pop().toLowerCase();
  var reader = new FileReader();
  reader.onerror = function() { setImportStatus('error', 'فشل قراءة الملف'); input.value = ''; };
  reader.onload = function(e) {
    var depts = filtDepts();
    var defaultDeptId = depts.length > 0 ? depts[0].id : state.departments[0].id;
    var added = 0, errors = 0;
    try {
      if (ext === 'txt' || ext === 'csv') {
        var text = e.target.result;
        var lines = text.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(function(l){ return l.length > 0; });
        var isCsv = ext === 'csv', start = 0;
        if (lines.length > 0) { var f = lines[0].toLowerCase(); if (f.indexOf('اسم')>=0||f.indexOf('name')>=0||f.indexOf('الاسم')>=0||f.indexOf('مدرب')>=0||f.indexOf('trainer')>=0) start = 1; }
        for (var i = start; i < lines.length; i++) {
          var parts = lines[i].split(isCsv ? ',' : /\t/);
          var name = (parts[0]||'').replace(/^["']|["']$/g,'').trim();
          var job = (parts[1]||'مدرب').replace(/^["']|["']$/g,'').trim();
          if (name) { state.trainers.push({ id:rnd('tr'), name:name, jobTitle:job, departmentId:defaultDeptId }); added++; } else errors++;
        }
      } else if (ext === 'xlsx' || ext === 'xls') {
        if (typeof XLSX === 'undefined') { setImportStatus('error','مكتبة Excel غير متوفرة'); input.value=''; return; }
        var data = new Uint8Array(e.target.result);
        var workbook = XLSX.read(data, { type:'array' });
        var rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header:1 });
        var start = 0;
        if (rows.length > 0 && rows[0][0]) { var f = String(rows[0][0]).toLowerCase(); if (f.indexOf('اسم')>=0||f.indexOf('name')>=0||f.indexOf('الاسم')>=0||f.indexOf('مدرب')>=0||f.indexOf('trainer')>=0) start = 1; }
        for (var i = start; i < rows.length; i++) {
          var row = rows[i]; if (!row || row.length === 0) continue;
          var name = String(row[0]||'').trim();
          var job = row[1] ? String(row[1]).trim() : 'مدرب';
          if (name) { state.trainers.push({ id:rnd('tr'), name:name, jobTitle:job, departmentId:defaultDeptId }); added++; } else errors++;
        }
      } else if (ext === 'pdf') {
        if (typeof pdfjsLib === 'undefined') { setImportStatus('error','مكتبة PDF غير متوفرة'); input.value=''; return; }
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        pdfjsLib.getDocument({ data: new Uint8Array(e.target.result) }).promise.then(function(pdf) {
          var fullText = '', ps = [];
          for (var i = 1; i <= pdf.numPages; i++) ps.push(pdf.getPage(i).then(function(p){ return p.getTextContent(); }).then(function(c){ fullText += c.items.map(function(it){ return it.str; }).join(' ') + '\n'; }));
          Promise.all(ps).then(function() {
            var lines = fullText.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(function(l){ return l.length > 0; });
            var a2 = 0, e2 = 0, s2 = 0;
            if (lines.length > 0) { var f = lines[0].toLowerCase(); if (f.indexOf('اسم')>=0||f.indexOf('name')>=0||f.indexOf('الاسم')>=0||f.indexOf('مدرب')>=0||f.indexOf('trainer')>=0) s2 = 1; }
            for (var i = s2; i < lines.length; i++) { var p = lines[i].split(/\t/); var n = (p[0]||'').trim(); var j = (p[1]||'مدرب').trim(); if (n) { state.trainers.push({ id:rnd('tr'), name:n, jobTitle:j, departmentId:defaultDeptId }); a2++; } else e2++; }
            saveState(); render();
            setImportStatus(a2>0?'success':'warning','تم استيراد '+a2+' مدرب'+(a2!==1?'ين':'')+(e2>0?'، '+e2+' سطر غير صالح':'')+' من PDF');
            input.value = '';
          });
        }).catch(function(){ setImportStatus('error','فشل قراءة ملف PDF'); input.value = ''; });
        return;
      } else { setImportStatus('error','صيغة ملف غير مدعومة'); input.value = ''; return; }
      saveState(); render();
      setImportStatus(added>0?'success':'warning','تم استيراد '+added+' مدرب'+(added!==1?'ين':'')+(errors>0?'، '+errors+' سطر غير صالح':''));
    } catch(err) { setImportStatus('error','خطأ في المعالجة: '+err.message); }
    input.value = '';
  };
  if (ext === 'txt' || ext === 'csv') reader.readAsText(file);
  else reader.readAsArrayBuffer(file);
}

var chartInstances = {};
function initCharts() {

  var pieLabels = [], pieData = [], pieColors = [];
  for (var rk3 in recCounts) { if (recCounts[rk3] > 0) { pieLabels.push(RECOMMENDATIONS_AR[rk3]); pieData.push(recCounts[rk3]); pieColors.push({improvement:'#f43f5e',acceptable:'#f97316',satisfactory:'#f59e0b',good:'#3b82f6',very_good:'#6366f1',excellent:'#10b981'}[rk3]||'#94a3b8'); } }
  var pieEl = document.getElementById('recChart');
  if (pieEl && pieData.length > 0) chartInstances.recChart = new Chart(pieEl, { type:'pie', data:{ labels:pieLabels, datasets:[{ data:pieData, backgroundColor:pieColors, borderWidth:0 }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ font:{size:10}, boxWidth:12 } } } } });
  // Dept average bar
  var deps = filtDepts();
  var depLabels = [], depData = [], depColors = [];
  deps.forEach(function(d){ var evs = fEv.filter(function(e){ return e.departmentId === d.id; }); if (evs.length === 0) return; var t2=0,m2=0; evs.forEach(function(e){ Object.values(e.ratings).forEach(function(s){t2+=s;m2+=5;}); }); depLabels.push(d.name.substring(0,12)+'..'); depData.push(m2>0?parseFloat((t2/(m2/5)).toFixed(1)):0); depColors.push('#'+Math.floor(Math.random()*16777215).toString(16)); });
  var barEl = document.getElementById('deptChart');
  if (barEl && depData.length > 0) chartInstances.deptChart = new Chart(barEl, { type:'bar', data:{ labels:depLabels, datasets:[{ label:'متوسط الدرجات', data:depData, backgroundColor:depColors, borderRadius:6 }] }, options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{ beginAtZero:true, max:5, ticks:{font:{size:10}} }, x:{ ticks:{font:{size:9}} } }, plugins:{ legend:{ display:false } } } });
}
// ====================== FEATURE: EXCEL EXPORT ======================
function exportEvalsExcel() {
  if (typeof XLSX === 'undefined') { alert('مكتبة Excel غير متوفرة'); return; }
  var fEv = filtEvals();
  if (fEv.length === 0) { alert('لا توجد تقييمات للتصدير'); return; }
  var data = [['المدرب','الوظيفة','القسم','المادة','الفصل','التاريخ','المجموع','التوصية','الملاحظات']];
  fEv.forEach(function(e){ var t3=0,m3=0; Object.values(e.ratings).forEach(function(s){t3+=s;m3+=5;}); data.push([e.trainerName,e.trainerJobTitle,e.departmentName,e.courseName,e.semester,e.evaluationDate,m3>0?(t3/(m3/5)).toFixed(1):'0',RECOMMENDATIONS_AR[e.finalRecommendation]||e.finalRecommendation,e.notes||'']); });
  var ws = XLSX.utils.aoa_to_sheet(data);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'التقييمات');
  XLSX.writeFile(wb, 'تقييمات_'+today()+'.xlsx');
}
function exportTrainersExcel() {
  if (typeof XLSX === 'undefined') { alert('مكتبة Excel غير متوفرة'); return; }
  var data = [['الاسم','المسمى الوظيفي','القسم']];
  state.trainers.forEach(function(t){ data.push([t.name,t.jobTitle,deptName(t.departmentId)]); });
  var ws = XLSX.utils.aoa_to_sheet(data);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'المدربين');
  XLSX.writeFile(wb, 'مدربين_'+today()+'.xlsx');
}
// ====================== FEATURE: EMAIL NOTIFICATION ======================
function notifyTrainerEmail(ev) {
  var subj = encodeURIComponent('تقييم أداء مدرب - '+ev.trainerName);
  var body = encodeURIComponent(
    'السلام عليكم\n\n'+
    'تم إضافة تقييم أداء للمدرب/ة: '+ev.trainerName+'\n'+
    'القسم: '+ev.departmentName+'\n'+
    'المادة: '+ev.courseName+'\n'+
    'تاريخ التقييم: '+ev.evaluationDate+'\n'+
    'المقيم: '+ev.assessorName+'\n\n'+
    'يمكنك الاطلاع على التقييم في نظام تقويم الأداء.\n\n'+
    'شكراً،\n'+state.institutionName
  );
  window.open('mailto:?subject='+subj+'&body='+body, '_blank');
}
// ====================== FEATURE: STATISTICAL REPORT ======================
function renderReport() {
  var fEv = filtEvals(), fTr = filtTr();
  var tt=0,mt=0; fEv.forEach(function(e){ Object.values(e.ratings).forEach(function(s){tt+=s;mt+=5;}); });
  var avg = mt>0?(tt/mt*5/5).toFixed(1):'0.0';
  var recCounts2 = {}; for (var rk4 in RECOMMENDATIONS_AR) recCounts2[rk4]=0;
  fEv.forEach(function(e){ if (recCounts2[e.finalRecommendation]!==undefined) recCounts2[e.finalRecommendation]++; });
  var recHtml = ''; for (var rk5 in recCounts2) { if (recCounts2[rk5]>0) recHtml += '<span class="inline-flex px-2.5 py-1 text-[10px] font-bold rounded-lg border ml-1 mb-1 '+REC_COLORS[rk5]+'">'+RECOMMENDATIONS_AR[rk5]+': '+recCounts2[rk5]+'</span> '; }
  var rows = ''; fEv.slice(0).reverse().forEach(function(e){ var t4=0,m4=0; Object.values(e.ratings).forEach(function(s){t4+=s;m4+=5;}); rows += '<tr class="border-t border-slate-200"><td class="p-2 text-[10px]">'+e.trainerName+'</td><td class="p-2 text-[10px]">'+e.departmentName+'</td><td class="p-2 text-[10px]">'+e.evaluationDate+'</td><td class="p-2 text-[10px] text-center font-bold">'+(m4>0?(t4/(m4/5)).toFixed(1):'-')+'</td></tr>'; });
  var w2 = window.open('', '_blank');
  if (!w2) { alert('الرجاء السماح بالنوافذ المنبثقة'); return; }
  w2.document.write('<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>تقرير إحصائي</title><style>body{font-family:Tahoma,Arial,sans-serif;padding:40px;background:#fff;color:#1e293b;max-width:900px;margin:0 auto}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:8px 12px;font-size:13px}th{background:#f1f5f9;font-weight:700}.header{text-align:center;border-bottom:3px solid #059669;padding-bottom:20px;margin-bottom:30px}.header h1{font-size:22px;color:#059669;margin:0 0 5px}.header p{font-size:12px;color:#94a3b8;margin:0}.stats{display:flex;gap:15px;justify-content:center;margin-bottom:30px}.stat{text-align:center;padding:15px 25px;background:#f8fafc;border-radius:12px;border:1px solid #e2e8f0}.stat .num{font-size:28px;font-weight:900;color:#0f172a}.stat .lbl{font-size:11px;color:#64748b;margin-top:3px}@media print{body{padding:20px}}</style></head><body><div class="header"><h1>تقرير إحصائي - '+state.institutionName+'</h1><p>تاريخ التقرير: '+today()+'</p></div><div class="stats"><div class="stat"><div class="num">'+fTr.length+'</div><div class="lbl">إجمالي المدربين</div></div><div class="stat"><div class="num">'+fEv.length+'</div><div class="lbl">التقييمات</div></div><div class="stat"><div class="num">'+avg+'</div><div class="lbl">المتوسط العام</div></div></div><h3 style="margin-bottom:8px;font-size:14px;">توزيع التوصيات</h3><div style="margin-bottom:25px;">'+(recHtml||'لا توجد')+'</div><h3 style="margin-bottom:8px;font-size:14px;">جميع التقييمات</h3><table><thead><tr><th>المدرب</th><th>القسم</th><th>التاريخ</th><th>المعدل</th></tr></thead><tbody>'+rows+'</tbody></table><p style="margin-top:30px;font-size:10px;color:#94a3b8;text-align:center;">تم الإنشاء بواسطة نظام تقويم الأداء التدريسي</p></body></html>');
  w2.document.close();
}
// ====================== FEATURE: AUTO-BACKUP ======================
var backupTimer = null;
function scheduleBackup() {
  if (backupTimer) clearTimeout(backupTimer);
  backupTimer = setTimeout(function(){
    try {
      var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'backup_الكلية_المهنية_بالسيب_'+today()+'.json';
      a.click();
      URL.revokeObjectURL(a.href);
    } catch(e) {}
  }, 30000); // 30s debounce
}
// Override saveState to include auto-backup
var _origSaveState = saveState;
saveState = function() {
  _origSaveState();
  var bk = localStorage.getItem('autoBackupEnabled');
  if (bk !== 'false') scheduleBackup();
};

// ====================== INIT ======================
render();
</script>
